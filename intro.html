<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ramzan Intro</title>

<style>

/* 🔥 Animated Background */
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;

    background: linear-gradient(270deg, #00c6ff, #0072ff, #6a11cb, #ff6ec4);
    background-size: 800% 800%;
    animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 🔲 Main Card */
.container {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    color: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
}

/* 🖼️ Profile Image */
.profile {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid white;
    object-fit: cover;
    margin-bottom: 15px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 10px white; }
    to { box-shadow: 0 0 25px cyan; }
}

/* ✨ Text Animation */
h1 {
    margin: 10px 0;
    animation: fadeIn 2s ease;
}

p {
    font-size: 18px;
    opacity: 0.9;
    animation: fadeIn 3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* 🔘 Button */
.btn {
    margin-top: 20px;
    padding: 10px 25px;
    border: none;
    border-radius: 25px;
    background: white;
    color: #0072ff;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.1);
    background: cyan;
    color: black;
}

</style>
</head>

<body>

<div class="container">

    <!-- 🖼️ Apni image yahan lagao -->
        <img src="ramzan.jpg.png" class="profile">

    <h1>Hi, I am Ramzan 👋</h1>
    <p>I am learning DevOps 🚀</p>

    <button class="btn">Welcome</button>

</div>

</body>
</html>
